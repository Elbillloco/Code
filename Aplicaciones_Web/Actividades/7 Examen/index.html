<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Semaforo</title>

    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="preload" href="css/style.css" as="style">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div>
            <h1 class="titulo_semaforo">Simulador de Semaforo</h1>
        </div>
    </header>

    <main class="contenedor_principal">

        <section class="seccion_semaforo">
            <div class="semaforo_cuerpo">
                <div id="luzRojo" class="luz rojo"></div>
                <div id="luzAmarillo" class="luz amarillo"></div>
                <div id="luzVerde" class="luz verde"></div>
            </div>
        </section>
    
        <section class="seccion_controles">
    
            <h2>Modo Automatico</h2>
            <div>
                <button id="btnAutoStart" class="btn btn_inicio">Iniciar Automatico</button>
                <button id="btnAutoStop" class="btn btn_detener">Detener Automatico</button>
            </div>
    
            <h2>Modo Manual</h2>
            <div class="bloque_botones">
                <button id="btnVerde" class="btn btn_verde">Verde</button>
                <button id="btnAmarillo" class="btn btn_amarillo">Amarillo</button>
                <button id="btnRojo" class="btn btn_rojo">Rojo</button>
            </div>
    
        </section>
    
        <section class="seccion_contadores">
            <h2 class="titulo_contador">Contador de colores</h2>
            <div class="contador_general">
                <div class="contador contador_verde">
                    <h3>Verde</h3>
                    <p id="cntVerde">0</p>
                </div>
                <div class="contador contador_amarillo">
                    <h3>Amarillo</h3>
                    <p id="cntAmarillo">0</p>
                </div>
                <div class="contador contador_rojo">
                    <h3>Rojo</h3>
                    <p id="cntRojo">0</p>
                </div>
            </div>
    
        </section>

    </main>

    <script src="js/semaforo.js"></script>

</body>
</html>
